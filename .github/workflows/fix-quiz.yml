name: Fix quiz

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Quiz navigation/progress fixes
          s = s.replace("document.getElementById('progressFill').style.width = ((currentQ / qs.length) * 100) + '%';", "document.getElementById('progressFill').style.width = (((currentQ + 1) / qs.length) * 100) + '%';")
          s = s.replace("  selectedOpts = [];\n\n  document.getElementById('qLabel')", "  selectedOpts = Array.isArray(answerIdx[currentQ]) ? answerIdx[currentQ].slice() : [];\n\n  document.getElementById('qLabel')")
          s = s.replace("    card.onclick = () => selectOpt(card, i, q.multi);\n    grid.appendChild(card);", "    if (selectedOpts.includes(i)) card.classList.add('selected');\n    card.onclick = () => selectOpt(card, i, q.multi);\n    grid.appendChild(card);")
          s = s.replace("  btnNext.disabled = true;\n}\n\nfunction selectOpt", "  btnNext.disabled = q.multi ? selectedOpts.length === 0 : false;\n}\n\nfunction selectOpt", 1)

          # Secure lead submission: Telegram token stays on the server
          start = s.index('async function submitForm() {')
          end = s.index('\nfunction escapeHtml', start)
          new = '''async function submitForm() {
  const nameEl = document.getElementById('inputName');
  const contactEl = document.getElementById('inputContact');
  const name = nameEl.value.trim();
  const contact = contactEl.value.trim();
  let ok = true;
  if (!name) { nameEl.classList.add('error'); ok = false; }
  if (!validContact(contact)) { contactEl.classList.add('error'); ok = false; }
  if (!ok) return;

  userName = name;
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  const oldLabel = btn.querySelector('span').textContent;
  btn.querySelector('span').textContent = '...';

  const t = T[lang];
  const qs = t.questions;
  const answerTexts = qs.map((q, i) => (answerIdx[i] || []).map(idx => q.opts[idx]?.t).filter(Boolean).join(', '));

  try {
    const response = await fetch('/api/send-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, contact, lang, answerTexts, questions: qs.map(q => q.q) })
    });
    if (!response.ok) throw new Error('Lead endpoint returned ' + response.status);

    try { gtag('event', 'generate_lead'); } catch (e) {}
    try { if (typeof fbq === 'function') fbq('track', 'Lead'); } catch (e) {}
    showThanks();
  } catch (e) {
    console.error('Lead submission error:', e);
    btn.disabled = false;
    btn.querySelector('span').textContent = oldLabel;
    alert(lang === 'uk' ? 'Не вдалося надіслати заявку. Спробуйте ще раз.' : 'Не удалось отправить заявку. Попробуйте ещё раз.');
  }
}
'''
          s = s[:start] + new + s[end:]

          # Contact buttons: Instagram + Telegram
          old_privacy = ".form-privacy { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }"
          new_privacy = old_privacy + '''
.form-social { margin-top: 24px; text-align: center; }
.form-social-title { font-size: 13px; color: var(--muted); margin-bottom: 11px; }
.social-links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.social-link { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--white); color: var(--text); text-decoration: none; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; transition: all 0.2s; }
.social-link:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-light); transform: translateY(-1px); }
.social-link svg { width: 17px; height: 17px; flex-shrink: 0; }'''
          if old_privacy in s and '.form-social {' not in s:
              s = s.replace(old_privacy, new_privacy, 1)

          old_mobile = '''@media (max-width: 820px) {
  .hero-wrap { grid-template-columns: 1fr; gap: 36px; padding-top: 40px; }
  .photo-card { max-width: 380px; }
  .options-grid { grid-template-columns: 1fr; }
  .form-card, .thanks-card { padding: 32px 24px; }
  .facts { gap: 24px; }
  .map-frame { padding: 16px; }
}'''
          new_mobile = '''@media (max-width: 960px) {
  .hero-wrap { grid-template-columns: 1fr; gap: 36px; padding-top: 40px; }
  .photo-card { max-width: 380px; width: 100%; margin: 0 auto; }
  .hero-left { min-width: 0; }
  .options-grid { grid-template-columns: 1fr; }
  .form-card, .thanks-card { padding: 32px 24px; }
  .facts { gap: 24px; }
  .map-frame { padding: 16px; }
  .lang-bar { position: relative; }
}

@media (max-width: 560px) {
  .hero-wrap { padding: 28px 16px 48px; gap: 28px; }
  .quiz-wrap, .result-wrap { padding-left: 16px; padding-right: 16px; }
  .form-outer, .thanks-outer { padding: 24px 16px; }
  .form-card, .thanks-card { padding: 28px 20px; border-radius: 18px; }
  .form-title { font-size: 28px; }
  .social-links { gap: 8px; }
  .social-link { font-size: 12px; }
}'''
          if old_mobile in s:
              s = s.replace(old_mobile, new_mobile, 1)
          else:
              s = s.replace('@media (max-width: 820px) {', '@media (max-width: 960px) {', 1)

          old_html = '''      <button class="btn-submit" id="btnSubmit" onclick="submitForm()"><span data-t="btnSubmit"></span></button>
      <p class="form-privacy" data-t="privacy"></p>'''
          new_html = '''      <button class="btn-submit" id="btnSubmit" onclick="submitForm()"><span data-t="btnSubmit"></span></button>
      <div class="form-social">
        <div class="form-social-title" data-t="socialTitle"></div>
        <div class="social-links">
          <a class="social-link" href="https://ig.me/m/anton_riakhin_psy" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
            <span>Instagram</span>
          </a>
          <a class="social-link" href="https://t.me/riakhin_anton" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 3.5 2.9 10.7c-.9.35-.88 1.6.03 1.92l4.73 1.66 1.76 5.48c.28.88 1.42 1.13 1.99.43l2.63-3.23 4.91 3.62c.72.53 1.74.15 1.95-.72l2.89-15.06c.19-.99-.75-1.68-1.68-1.3Z"/><path d="m8 14.3 9.2-7.1-7.45 8.55"/></svg>
            <span>Telegram</span>
          </a>
        </div>
      </div>
      <p class="form-privacy" data-t="privacy"></p>'''
          if old_html in s and 'href="https://ig.me/m/anton_riakhin_psy"' not in s:
              s = s.replace(old_html, new_html, 1)

          s = s.replace('''    btnSubmit: "Записатись на розбір →",
    privacy:''','''    btnSubmit: "Записатись на розбір →",
    socialTitle: "Або можете написати мені напряму",
    privacy:''',1)
          s = s.replace('''    btnSubmit: "Записаться на разбор →",
    privacy:''','''    btnSubmit: "Записаться на разбор →",
    socialTitle: "Или можете написать мне напрямую",
    privacy:''',1)

          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix quiz navigation, mobile layout and contact buttons'
          git push
