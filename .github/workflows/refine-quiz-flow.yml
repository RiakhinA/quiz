name: Refine quiz flow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine current quiz UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # 1) Map CTA wording.
          s=s.replace('Натисніть тут, щоб побачити нову дорогу','Натисніть тут, щоб рухатися новою дорогою')
          s=s.replace('Нажмите здесь, чтобы увидеть новую дорогу','Нажмите здесь, чтобы двигаться по новой дороге')

          # 2) Instagram: use stable profile URL instead of broken ig.me redirect.
          for old in [
              'https://ig.me/m/anton__riakhin__psy',
              'https://ig.me/m/anton_riakhin_psy',
              'https://www.instagram.com/m/anton__riakhin__psy'
          ]:
              s=s.replace(old,'https://www.instagram.com/anton__riakhin__psy/')

          # 3) Messenger buttons: white cards + recognizable service icons, not colored pills.
          css_add='''\n<style id="messenger-refine-css">\n.messengers .messenger-btn{background:#fff!important;border:1.5px solid var(--border)!important;color:var(--text)!important;gap:9px;min-height:56px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.025)}\n.messengers .messenger-btn:hover{border-color:var(--teal)!important;background:#fff!important;transform:translateY(-1px)}\n.messenger-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px}\n.messenger-icon svg{width:22px;height:22px;display:block}\n</style>\n'''
          if 'id="messenger-refine-css"' not in s:
              s=s.replace('</head>',css_add+'</head>',1)

          # Replace only final booking messenger labels with icon + name if not already enhanced.
          icons={
          'Instagram':'''<span class="messenger-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#C13584" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="#C13584" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="#C13584"/></svg></span><span>Instagram</span>''',
          'Telegram':'''<span class="messenger-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#229ED9"><path d="M21.6 3.2 18.4 20c-.24 1.18-.87 1.47-1.76.92l-4.88-3.6-2.35 2.27c-.26.26-.48.48-.98.48l.35-4.98 9.07-8.2c.4-.35-.09-.55-.61-.2L6.03 13.75l-4.83-1.51c-1.05-.33-1.07-1.05.22-1.56L20.3 3.4c.88-.32 1.65.2 1.3-.2Z"/></svg></span><span>Telegram</span>''',
          'WhatsApp':'''<span class="messenger-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#25D366"><path d="M12 2a9.8 9.8 0 0 0-8.4 14.85L2 22l5.3-1.55A9.97 9.97 0 1 0 12 2Zm0 17.9a7.8 7.8 0 0 1-4-1.1l-.29-.17-3.14.92.94-3.06-.19-.31A7.87 7.87 0 1 1 12 19.9Zm4.32-5.9c-.24-.12-1.4-.69-1.62-.77-.22-.08-.38-.12-.54.12-.16.24-.62.77-.76.93-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.42-1.33-1.66-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.4-.54-.41h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2 0 1.18.86 2.32.98 2.48.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.16 1.51.1.46-.07 1.4-.57 1.6-1.12.2-.55.2-1.02.14-1.12-.06-.1-.22-.16-.46-.28Z"/></svg></span><span>WhatsApp</span>''',
          'Viber':'''<span class="messenger-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#7360F2"><path d="M12 2C6.48 2 2 5.86 2 10.62c0 2.72 1.48 5.15 3.79 6.73L5 22l4.58-2.52c.78.17 1.59.26 2.42.26 5.52 0 10-3.86 10-8.62S17.52 2 12 2Zm4.31 12.73c-.27.61-1.37 1.16-1.88 1.22-.47.05-1.06.08-1.71-.13-.39-.13-.9-.29-1.55-.57-2.72-1.17-4.5-3.91-4.64-4.1-.13-.18-1.1-1.46-1.1-2.79 0-1.33.7-1.98.94-2.25.25-.27.54-.34.72-.34h.52c.17 0 .39-.06.61.46.23.55.78 1.9.85 2.03.07.14.12.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.42.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.2 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.06.18-.27.36-.23.61-.14.25.09 1.58.75 1.85.88.27.14.45.2.52.32.07.11.07.66-.2 1.27Z"/></svg></span><span>Viber</span>'''
          }
          for name,html in icons.items():
              # Covers plain inner text only; does not touch select options.
              s=s.replace('>'+name+'</a>','>'+html+'</a>')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine quiz CTA and messenger buttons"
          git push
