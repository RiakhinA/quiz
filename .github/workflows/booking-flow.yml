name: Keep booking UX aligned

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch booking UX
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('data-bk-uk="Ваше ім’я" data-bk-ru="Ваше имя"></label><input class="form-input" id="inputName" type="text"',
                      'data-bk-uk="Ваше ім’я *" data-bk-ru="Ваше имя *"></label><input class="form-input" id="inputName" type="text" required')
          s=s.replace('data-bk-uk="Телефон — якщо зручно" data-bk-ru="Телефон — если удобно"',
                      'data-bk-uk="Телефон — необов’язково" data-bk-ru="Телефон — необязательно"')

          old_start="function startBooking(){try{gtag('event','booking_start')}catch(e){};const n=document.getElementById('inputName')?.value||'';const c=document.getElementById('inputContact')?.value||'';if(document.getElementById('finalName'))document.getElementById('finalName').value=n;if(document.getElementById('finalContact'))document.getElementById('finalContact').value=c;bookingDay='today';bookingDate='';renderSlots();goTo('booking-time');renderBookingTexts()}"
          new_start="function startBooking(){const nameEl=document.getElementById('inputName');const n=(nameEl?.value||'').trim();if(!n){nameEl?.classList.add('error');nameEl?.focus();return}nameEl?.classList.remove('error');try{gtag('event','booking_start')}catch(e){};const c=document.getElementById('inputContact')?.value||'';if(document.getElementById('finalName'))document.getElementById('finalName').value=n;if(document.getElementById('finalContact'))document.getElementById('finalContact').value=c;bookingDay='today';bookingDate='';renderSlots();goTo('booking-time');renderBookingTexts()}"
          s=s.replace(old_start,new_start)

          old_social='<div class="social-links"><a class="social-link" href="https://ig.me/m/anton_riakhin_psy" target="_blank" rel="noopener noreferrer" onclick="trackMessengerOnly(\'Instagram\')">Instagram</a><a class="social-link" href="https://t.me/riakhin_anton" target="_blank" rel="noopener noreferrer" onclick="trackMessengerOnly(\'Telegram\')">Telegram</a></div>'
          new_social='''<div class="messengers booking-direct-messengers"><a class="messenger-btn" href="https://ig.me/m/anton_riakhin_psy" target="_blank" rel="noopener noreferrer" onclick="trackMessengerOnly('Instagram')"><span class="messenger-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#C13584" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="#C13584" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="#C13584"/></svg></span><span>Instagram</span></a><a class="messenger-btn" href="https://t.me/riakhin_anton" target="_blank" rel="noopener noreferrer" onclick="trackMessengerOnly('Telegram')"><span class="messenger-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="#229ED9"><path d="M21.6 3.2 18.4 20c-.24 1.18-.87 1.47-1.76.92l-4.88-3.6-2.35 2.27c-.26.26-.48.48-.98.48l.35-4.98 9.07-8.2c.4-.35-.09-.55-.61-.2L6.03 13.75l-4.83-1.51c-1.05-.33-1.07-1.05.22-1.56L20.3 3.4c.88-.32 1.65.2 1.3-.2Z"/></svg></span><span>Telegram</span></a></div>'''
          s=s.replace(old_social,new_social)

          s=s.replace('<a class="messenger-btn" href="viber://chat?number=%2B380935503707" onclick="trackMessengerLink(event,\'Viber\')">',
                      '<a class="messenger-btn" href="viber://chat?number=%2B380935503707" onclick="return openViberFallback(event)">')
          if 'function openViberFallback' not in s:
              insert="""
          function openViberFallback(ev){
            try{trackMessengerLink(ev,'Viber')}catch(e){ev.preventDefault()}
            try{navigator.clipboard.writeText('+380935503707')}catch(e){}
            setTimeout(()=>{if(!document.hidden){alert(lang==='uk'?'Viber не відкрив чат автоматично. Номер +380935503707 скопійовано — відкрийте Viber і вставте його.':'Viber не открыл чат автоматически. Номер +380935503707 скопирован — откройте Viber и вставьте его.')}},1200)
            return true
          }
          """
              s=s.replace('// BOOKING_FLOW_JS_END',insert+'\n// BOOKING_FLOW_JS_END',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix booking UX'
          git push
