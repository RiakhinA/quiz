<style>
:root {
  --cream: #FAF8F4;
  --white: #FFFFFF;
  --teal: #2E6E6B;
  --teal-light: #E9F2F1;
  --teal-dark: #1F4F4D;
  --teal-glow: rgba(46,110,107,0.15);
  --text: #1A1D1C;
  --muted: #6E7573;
  --border: #E6E2DB;
  --clay: #BE7B4E;
  --clay-light: #FAF0E7;
  --danger: #C0563E;
  --danger-light: #FBEEEA;
  --shadow-sm: 0 2px 12px rgba(26,29,28,0.05);
  --shadow: 0 8px 32px rgba(26,29,28,0.09);
  --radius: 18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Manrope', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

svg { display: block; }

/* LANG BAR */
.lang-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: rgba(250,248,244,0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand-mark {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--teal-dark);
  letter-spacing: -0.01em;
}
.lang-switch { display: flex; gap: 4px; background: var(--white); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
.lang-btn {
  background: none; border: none; border-radius: 7px;
  padding: 5px 13px; font-family: 'Manrope', sans-serif;
  font-size: 13px; font-weight: 700; cursor: pointer;
  color: var(--muted); transition: all 0.2s;
}
.lang-btn.active { background: var(--teal); color: #fff; }

/* ===== HERO ===== */
.hero-wrap {
  max-width: 1080px; margin: 0 auto;
  padding: 56px 24px 72px;
  display: grid; grid-template-columns: 1fr 360px;
  gap: 56px; align-items: center; flex: 1;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--teal-light); color: var(--teal-dark);
  border-radius: 30px; padding: 7px 16px;
  font-size: 13px; font-weight: 700; margin-bottom: 26px;
  letter-spacing: 0.01em;
}
.eyebrow svg { width: 15px; height: 15px; }
.hero-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(32px, 4.2vw, 50px);
  font-weight: 600; line-height: 1.15;
  letter-spacing: -0.01em; margin-bottom: 22px;
}
.hero-title em { font-style: italic; color: var(--teal); }
.hero-sub {
  font-size: 17px; color: var(--muted);
  margin-bottom: 32px; max-width: 520px; line-height: 1.65;
}
.value-promise {
  display: flex; flex-direction: column; gap: 12px;
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px 24px;
  margin-bottom: 32px; max-width: 520px; box-shadow: var(--shadow-sm);
}
.value-promise-head {
  font-size: 12px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--teal); margin-bottom: 2px;
}
.value-item { display: flex; align-items: flex-start; gap: 12px; }
.value-item svg { width: 20px; height: 20px; color: var(--teal); flex-shrink: 0; margin-top: 2px; }
.value-item span { font-size: 14.5px; color: var(--text); font-weight: 500; }
.value-item b { font-weight: 700; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--teal); color: #fff; border: none;
  border-radius: 14px; padding: 18px 34px;
  font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all 0.22s; margin-bottom: 42px;
}
.btn-primary:hover { background: var(--teal-dark); transform: translateY(-2px); box-shadow: 0 10px 28px var(--teal-glow); }
.btn-primary svg { width: 18px; height: 18px; }

.facts { display: flex; gap: 36px; flex-wrap: wrap; }
.fact-num {
  font-family: 'Playfair Display', serif;
  font-size: 30px; font-weight: 600; color: var(--teal);
  line-height: 1; margin-bottom: 6px;
}
.fact-label { font-size: 13px; color: var(--muted); max-width: 130px; }

.photo-card {
  background: var(--white); border-radius: 22px; overflow: hidden;
  box-shadow: var(--shadow); border: 1px solid var(--border);
}
.photo-ph {
  width: 100%; aspect-ratio: 4/5;
  background: linear-gradient(160deg, #E9F2F1 0%, #D3E7E5 100%);
  display: block; overflow: hidden;
}
.photo-ph img {
  width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  display: block;
}
.photo-foot { padding: 20px 22px; border-top: 1px solid var(--border); }
.photo-foot strong { display: block; font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.photo-foot span { font-size: 13px; color: var(--muted); line-height: 1.4; }

/* ===== QUIZ ===== */
.quiz-wrap { max-width: 660px; margin: 0 auto; padding: 36px 24px 64px; flex: 1; width: 100%; }
.quiz-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.quiz-step-label { font-size: 13px; color: var(--muted); font-weight: 700; }
.quiz-mini-map-hint { font-size: 12px; color: var(--teal); font-weight: 600; display: flex; align-items: center; gap: 5px; }
.quiz-mini-map-hint svg { width: 13px; height: 13px; }
.progress-bar { height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.progress-fill { height: 100%; background: var(--teal); border-radius: 10px; transition: width 0.45s cubic-bezier(0.4,0,0.2,1); }

.quiz-gift-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--clay-light); border: 1px solid #EAD3BC;
  border-radius: 11px; padding: 11px 16px; margin-bottom: 30px;
  font-size: 13px; color: #9A6236; font-weight: 600;
}
.quiz-gift-bar svg { width: 17px; height: 17px; color: var(--clay); flex-shrink: 0; }

.q-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(22px, 3.2vw, 29px);
  font-weight: 600; margin-bottom: 26px; line-height: 1.3;
}
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.option-card {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: 14px; padding: 18px 16px; cursor: pointer;
  transition: all 0.18s; text-align: left;
  display: flex; flex-direction: column; gap: 10px;
}
.option-card:hover { border-color: var(--teal); background: var(--teal-light); transform: translateY(-1px); }
.option-card.selected { border-color: var(--teal); background: var(--teal-light); box-shadow: 0 0 0 1px var(--teal); }
.opt-icon { width: 26px; height: 26px; color: var(--teal); }
.opt-icon svg { width: 26px; height: 26px; }
.opt-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
.opt-sub { font-size: 12px; color: var(--muted); line-height: 1.4; }

.quiz-nav { display: flex; gap: 12px; }
.btn-back {
  background: none; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 14px 22px; font-family: 'Manrope', sans-serif;
  font-size: 14px; font-weight: 600; cursor: pointer;
  color: var(--muted); transition: all 0.2s;
}
.btn-back:hover { border-color: var(--teal); color: var(--teal); }
.btn-next {
  flex: 1; background: var(--teal); border: none; border-radius: 12px;
  padding: 16px; font-family: 'Manrope', sans-serif;
  font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.2s;
}
.btn-next:hover { background: var(--teal-dark); }
.btn-next:disabled { opacity: 0.35; cursor: not-allowed; }

/* ===== RESULT / MAP ===== */
.result-wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 72px; flex: 1; width: 100%; }
.result-head { text-align: center; margin-bottom: 28px; }
.result-icon-state {
  width: 56px; height: 56px; margin: 0 auto 18px;
  background: var(--teal-light); border-radius: 16px;
  display: flex; align-items: center; justify-content: center; color: var(--teal);
}
.result-icon-state svg { width: 30px; height: 30px; }
.result-title { font-family: 'Playfair Display', serif; font-size: clamp(24px, 3.5vw, 34px); font-weight: 600; line-height: 1.25; }

/* MAP CANVAS */
.map-frame {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 22px; padding: 24px; margin-bottom: 24px;
  box-shadow: var(--shadow); overflow: hidden; position: relative;
}
.map-svg-wrap { width: 100%; position: relative; }
#mapSvg { width: 100%; height: auto; }

.map-cta-hint {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--teal); color: #fff; border: none; width: 100%;
  border-radius: 12px; padding: 15px; margin-top: 18px;
  font-family: 'Manrope', sans-serif; font-size: 14.5px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; animation: pulse 1.8s infinite;
}
.map-cta-hint svg { width: 18px; height: 18px; }
.map-cta-hint:hover { background: var(--teal-dark); animation: none; }
.map-cta-hint.hidden { display: none; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--teal-glow); }
  50% { box-shadow: 0 0 0 10px rgba(46,110,107,0); }
}

.insight-blocks { display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }
.insight-block {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 16px; padding: 24px 26px;
  opacity: 0; transform: translateY(16px);
  transition: opacity 0.5s, transform 0.5s;
}
.insight-block.show { opacity: 1; transform: translateY(0); }
.insight-block-label {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--teal); margin-bottom: 12px;
}
.insight-block-label svg { width: 15px; height: 15px; }
.insight-block p { font-size: 15px; line-height: 1.65; color: var(--text); margin-bottom: 10px; }
.insight-block p:last-child { margin-bottom: 0; }
.insight-accent {
  margin-top: 14px; padding: 12px 16px; background: var(--teal-light);
  border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--teal-dark);
  display: flex; align-items: flex-start; gap: 8px;
}
.insight-accent svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; }

.result-form-trigger { text-align: center; margin-top: 28px; opacity: 0; transform: translateY(16px); transition: all 0.5s; }
.result-form-trigger.show { opacity: 1; transform: translateY(0); }

/* ===== FORM ===== */
.form-outer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
.form-card {
  background: var(--white); border-radius: 22px; padding: 44px;
  max-width: 520px; width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border);
}
.form-eyebrow {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--teal-light); color: var(--teal-dark);
  border-radius: 30px; padding: 6px 14px; font-size: 12px;
  font-weight: 800; margin-bottom: 18px; letter-spacing: 0.04em; text-transform: uppercase;
}
.form-eyebrow svg { width: 14px; height: 14px; }
.form-title { font-family: 'Playfair Display', serif; font-size: 25px; font-weight: 600; margin-bottom: 22px; line-height: 1.3; }
.form-gift {
  display: flex; align-items: center; gap: 11px;
  background: var(--clay-light); border: 1px solid #EAD3BC;
  border-radius: 12px; padding: 13px 17px; margin-bottom: 14px;
  font-size: 14px; font-weight: 600; color: #9A6236;
}
.form-gift svg { width: 18px; height: 18px; color: var(--clay); flex-shrink: 0; }
.deficit-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--danger-light); border: 1px solid #F0CFC5;
  border-radius: 10px; padding: 10px 16px; margin-bottom: 26px;
  font-size: 13px; color: var(--danger); font-weight: 600;
}
.deficit-bar svg { width: 16px; height: 16px; flex-shrink: 0; }
.form-field { margin-bottom: 15px; }
.form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; }
.form-input {
  width: 100%; border: 1.5px solid var(--border); border-radius: 12px;
  padding: 14px 16px; font-family: 'Manrope', sans-serif; font-size: 15px;
  color: var(--text); background: var(--cream); transition: border-color 0.2s; outline: none;
}
.form-input:focus { border-color: var(--teal); background: #fff; }
.form-input.error { border-color: var(--danger); }
.btn-submit {
  width: 100%; background: var(--teal); border: none; border-radius: 14px;
  padding: 18px; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700;
  color: #fff; cursor: pointer; margin-top: 8px; transition: all 0.2s;
}
.btn-submit:hover { background: var(--teal-dark); transform: translateY(-1px); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.form-privacy { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }

/* ===== THANKS ===== */
.thanks-outer { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
.thanks-card {
  background: var(--white); border-radius: 22px; padding: 52px 44px;
  max-width: 520px; width: 100%; text-align: center; box-shadow: var(--shadow); border: 1px solid var(--border);
}
.thanks-icon {
  width: 70px; height: 70px; background: var(--teal-light); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 26px; color: var(--teal);
}
.thanks-icon svg { width: 36px; height: 36px; }
.thanks-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; margin-bottom: 12px; }
.thanks-sub { font-size: 16px; color: var(--muted); margin-bottom: 34px; line-height: 1.6; }
.steps-list { text-align: left; display: flex; flex-direction: column; gap: 18px; }
.step-item { display: flex; align-items: flex-start; gap: 14px; }
.step-num {
  width: 34px; height: 34px; background: var(--teal); border-radius: 50%;
  display: flex; align-items: center; justify-content: center; color: #fff;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
}
.step-text strong { display: block; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.step-text span { font-size: 13.5px; color: var(--muted); }

@media (max-width: 820px) {
  .hero-wrap { grid-template-columns: 1fr; gap: 36px; padding-top: 40px; }
  .photo-card { max-width: 380px; }
  .options-grid { grid-template-columns: 1fr; }
  .form-card, .thanks-card { padding: 32px 24px; }
  .facts { gap: 24px; }
  .map-frame { padding: 16px; }
}
</style>

</head>
<body>

<!-- ===== HERO ===== -->
<div id="screen-hero" class="screen active">
  <div class="lang-bar">
    <div class="brand-mark">Антон Ряхін</div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="uk" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
    </div>
  </div>
  <div class="hero-wrap">
    <div class="hero-left">
      <div class="eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span data-t="eyebrow"></span>
      </div>
      <h1 class="hero-title" data-t="heroTitle"></h1>
      <p class="hero-sub" data-t="heroSub"></p>
      <div class="value-promise">
        <div class="value-promise-head" data-t="valueHead"></div>
        <div class="value-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span data-t="value1"></span>
        </div>
        <div class="value-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          <span data-t="value2"></span>
        </div>
      </div>
      <button class="btn-primary" onclick="goTo('quiz')">
        <span data-t="heroBtn"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
      <div class="facts">
        <div class="fact-item"><div class="fact-num">400+</div><div class="fact-label" data-t="fact1"></div></div>
        <div class="fact-item"><div class="fact-num">30</div><div class="fact-label" data-t="fact2"></div></div>
        <div class="fact-item"><div class="fact-num">100%</div><div class="fact-label" data-t="fact3"></div></div>
      </div>
    </div>
    <div class="photo-card">
      <div class="photo-ph">
        <img src="map-hero.png" alt="Антон Ряхін">
      </div>
      <div class="photo-foot">
        <strong>Антон Ряхін</strong>
        <span data-t="photoRole"></span>
      </div>
    </div>
  </div>
</div>

<!-- ===== QUIZ ===== -->
<div id="screen-quiz" class="screen">
  <div class="lang-bar">
    <div class="brand-mark">Антон Ряхін</div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="uk" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
    </div>
  </div>
  <div class="quiz-wrap">
    <div class="quiz-top">
      <div class="quiz-step-label" id="qLabel"></div>
      <div class="quiz-mini-map-hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
        <span data-t="mapBuilding"></span>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="quiz-gift-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      <span data-t="quizGiftBar"></span>
    </div>
    <h2 class="q-title" id="questionTitle"></h2>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="quiz-nav">
      <button class="btn-back" id="btnBack" onclick="prevQ()"><span data-t="btnBack"></span></button>
      <button class="btn-next" id="btnNext" onclick="nextQ()" disabled><span data-t="btnNext"></span></button>
    </div>
  </div>
</div>

<!-- ===== LOADER ===== -->
<div id="screen-loader" class="screen" style="align-items:center;justify-content:center;background:var(--white);">
  <div style="text-align:center;max-width:380px;padding:40px 24px;">
    <div style="width:72px;height:72px;border:4px solid var(--teal-light);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 32px;"></div>
    <div style="font-family:'Playfair Display',serif;font-size:24px;font-weight:600;margin-bottom:20px;" data-t="loaderTitle"></div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="loader-step" id="ls1"><span data-t="ls1"></span></div>
      <div class="loader-step" id="ls2"><span data-t="ls2"></span></div>

// State icons for the map (index of Q1 answer -> icon key)
const STATE_ICONS = ['flame', 'compass', 'zap', 'tornado'];

// ============ STATE ============
let lang = 'uk';
let currentQ = 0;
let answers = [];       // stored answer text per question
let answerIdx = [];     // stored answer index per question (for map)
let selectedOpts = [];
let userName = '';
let wallRevealed = false;

// ============ LANG ============
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  document.documentElement.lang = l;
  renderTexts();
  if (isActive('quiz')) renderQuestion();
  if (isActive('result')) renderResultTexts();
}

function isActive(name) { return document.getElementById('screen-' + name).classList.contains('active'); }

function renderTexts() {
  const t = T[lang];
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = t[el.dataset.t];
    if (typeof v === 'string') el.innerHTML = v;
  });
  document.querySelectorAll('[data-ph]').forEach(el => {
    const v = t[el.dataset.ph];
    if (v) el.placeholder = v;
  });
}

// ============ NAV ============
function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
  window.scrollTo(0, 0);
  if (screen === 'quiz') { renderQuestion(); }
  if (screen === 'loader') runLoader();
  if (screen === 'result') showResult();
}

// ============ QUIZ ============
function renderQuestion() {
  const t = T[lang];
  const qs = t.questions;
  const q = qs[currentQ];
  selectedOpts = [];

  document.getElementById('qLabel').textContent = t.qLabel(currentQ + 1, qs.length);
  document.getElementById('progressFill').style.width = ((currentQ / qs.length) * 100) + '%';
  document.getElementById('questionTitle').textContent = q.q;
  document.getElementById('btnBack').style.display = 'block';

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  q.opts.forEach((o, i) => {
    const card = document.createElement('div');
    card.className = 'option-card';
    card.innerHTML = `<div class="opt-icon">${ICON[o.icon]}</div><div class="opt-title">${o.t}</div><div class="opt-sub">${o.s}</div>`;
    card.onclick = () => selectOpt(card, i, q.multi);
    grid.appendChild(card);
  });

  const btnNext = document.getElementById('btnNext');
  btnNext.style.display = q.multi ? 'block' : 'none';
  btnNext.disabled = true;
}

function selectOpt(card, idx, multi) {
  const cards = document.querySelectorAll('.option-card');
  if (multi) {
    card.classList.toggle('selected');
    selectedOpts = Array.from(cards).map((c, i) => c.classList.contains('selected') ? i : -1).filter(i => i >= 0);
    document.getElementById('btnNext').disabled = selectedOpts.length === 0;
  } else {
    cards.forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedOpts = [idx];
    setTimeout(nextQ, 320);
  }
}

function nextQ() {
  const t = T[lang];
  answers[currentQ] = selectedOpts.map(i => t.questions[currentQ].opts[i].t).join(', ');
  answerIdx[currentQ] = selectedOpts.slice();
  currentQ++;
  if (currentQ >= t.questions.length) goTo('loader');
  else renderQuestion();
}

function prevQ() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
  else goTo('hero');
}

// ============ LOADER ============
function runLoader() {
  const steps = ['ls1', 'ls2', 'ls3'];
  steps.forEach(id => document.getElementById(id).classList.remove('done'));
  let i = 0;
  const iv = setInterval(() => {
    if (i < steps.length) { document.getElementById(steps[i]).classList.add('done'); i++; }
    else { clearInterval(iv); setTimeout(() => goTo('result'), 400); }
  }, 750);
}

// ============ RESULT + MAP ============
function renderResultTexts() {
  renderTexts();
  // state icon
  const stateKey = STATE_ICONS[(answerIdx[0] && answerIdx[0][0]) || 0];
  document.getElementById('resultStateIcon').innerHTML = ICON[stateKey];
  // accent from Q6 (first selected)
  const t = T[lang];
  const q6 = answerIdx[5] || [0];
  document.getElementById('accentText').textContent = t.accents[q6[0]] || t.accents[0];
}

function showResult() {
  wallRevealed = false;
  renderResultTexts();
  buildMap();
  // reset insight blocks
  ['ib1','ib2','ib3'].forEach(id => document.getElementById(id).classList.remove('show'));
  document.getElementById('resultFormTrigger').classList.remove('show');
  document.getElementById('mapCtaHint').classList.remove('hidden');

  setTimeout(animateRoad, 300);
}

function animateRoad() {
  const svg = document.getElementById('mapSvg');
  const road = svg.querySelector('#oldRoad');
  const car = svg.querySelector('#carGroup');
  const wall = svg.querySelector('#wallGroup');

  // draw road
  road.style.transition = 'stroke-dashoffset 1.6s ease';
  requestAnimationFrame(() => { road.style.strokeDashoffset = '0'; });

  // car drives along path
  car.setAttribute('opacity', '1');
  const path = svg.querySelector('#oldRoad');
  const len = path.getTotalLength();
  const dur = 1600;
  let start = null;
  function step(ts) {
    if (!start) start = ts;
    const prog = Math.min((ts - start) / dur, 1);
    const pt = path.getPointAtLength(prog * len * 0.98);
    car.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    if (prog < 1) requestAnimationFrame(step);
    else {
      // show wall + little bump
      wall.setAttribute('opacity', '1');
      wall.style.transition = 'opacity 0.4s';
      bumpCar(car, pt);
    }
  }
  requestAnimationFrame(step);
}

function bumpCar(car, pt) {
  let t0 = null;
  function b(ts) {
    if (!t0) t0 = ts;
    const p = (ts - t0) / 600;
    if (p < 1) {
      const off = Math.sin(p * Math.PI * 3) * 4 * (1 - p);
      car.setAttribute('transform', `translate(${pt.x - Math.abs(off)},${pt.y})`);
      requestAnimationFrame(b);
    } else {
      car.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    }
  }
  requestAnimationFrame(b);
}

function revealWall() {
  if (wallRevealed) return;
  wallRevealed = true;
  const svg = document.getElementById('mapSvg');
  document.getElementById('mapCtaHint').classList.add('hidden');

  // wall becomes translucent
  const wallRect = svg.querySelector('#wallRect');
  svg.querySelector('#wallGroup').style.transition = 'opacity 0.5s';
  svg.querySelector('#wallGroup').setAttribute('opacity', '0.35');

  // habit marker appears
  const habit = svg.querySelector('#habitMarker');
  habit.style.transition = 'opacity 0.5s';
  habit.setAttribute('opacity', '1');
  setTimeout(() => {
    svg.querySelector('#habitLabelBox').style.transition = 'opacity 0.5s';
    svg.querySelector('#habitLabelBox').setAttribute('opacity', '1');
  }, 400);

  // draw new road
  setTimeout(() => {
    const newRoad = svg.querySelector('#newRoadPath');
    newRoad.setAttribute('opacity', '1');
    newRoad.style.transition = 'stroke-dashoffset 1.3s ease';
    newRoad.style.strokeDashoffset = '0';
  }, 700);

  // car moves to new route
  setTimeout(() => moveCarNewRoute(), 1400);

  // flag
  setTimeout(() => {
    const flag = svg.querySelector('#flagGroup');
    flag.style.transition = 'opacity 0.5s';
    flag.setAttribute('opacity', '1');
  }, 2600);

  // reveal insight blocks
  setTimeout(() => revealInsights(), 1200);
}

function moveCarNewRoute() {
  const svg = document.getElementById('mapSvg');
  const car = svg.querySelector('#carGroup');
  const path = svg.querySelector('#newRoadPath');
  const len = path.getTotalLength();
  const dur = 1400;
  let start = null;
  function step(ts) {
    if (!start) start = ts;
    const prog = Math.min((ts - start) / dur, 1);
    const pt = path.getPointAtLength(prog * len);
    car.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    if (prog < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function revealInsights() {
  const ids = ['ib1', 'ib2', 'ib3'];
  ids.forEach((id, i) => {
    setTimeout(() => document.getElementById(id).classList.add('show'), i * 450);
  });
  setTimeout(() => document.getElementById('resultFormTrigger').classList.add('show'), ids.length * 450 + 200);
}

// ============ FORM ============
function validContact(v) {
  v = v.trim();
  if (!v) return false;
  if (v.startsWith('@') && v.length > 2) return true; // Telegram @username
  const digits = v.replace(/\D/g, '');
  return digits.length >= 7; // any international number
}

async function submitForm() {
  const nameEl = document.getElementById('inputName');
  const contactEl = document.getElementById('inputContact');
  const name = nameEl.value.trim();
  const contact = contactEl.value.trim();
  let ok = true;
  if (!name) { nameEl.classList.add('error'); ok = false; }
  if (!validContact(contact)) { contactEl.classList.add('error'); ok = false; }
  if (!ok) return;

  userName = name;
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  const oldLabel = btn.querySelector('span').textContent;
  btn.querySelector('span').textContent = '...';

  const t = T[lang];
  const qs = t.questions;
  let msg = `<b>🎯 Новая заявка с квиза «Карта выхода»!</b>\n\n`;
  msg += `<b>Имя:</b> ${escapeHtml(name)}\n<b>Контакт:</b> ${escapeHtml(contact)}\n<b>Язык:</b> ${lang.toUpperCase()}\n\n<b>Ответы:</b>\n`;
  answers.forEach((a, i) => { msg += `${i + 1}. ${qs[i].q}\n→ ${a}\n`; });

  const TELEGRAM_BOT_TOKEN = '8908748343:AAEe54YM4vXz-K4ekFLEWljmHNDy06yqVMY';
  const TELEGRAM_CHAT_ID = '8530071';

  try {
    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'HTML' })
    });
  } catch (e) { console.log('TG error', e); }

  try { gtag('event', 'generate_lead'); } catch (e) {}
  try { fbq('track', 'Lead'); } catch (e) {}

  showThanks();
}

function escapeHtml(s) { return s.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])); }

function showThanks() {
  const title = lang === 'uk' ? `Дякую, ${userName}!` : `Спасибо, ${userName}!`;
  document.getElementById('thanksTitle').textContent = title;
  renderTexts();
  goTo('thanks');
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.form-input').forEach(inp => inp.addEventListener('input', () => inp.classList.remove('error')));
  renderTexts();
});
