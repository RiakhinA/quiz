<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --cream: #FAF8F4;
  --white: #FFFFFF;
  --teal: #2E6E6B;
  --teal-light: #E9F2F1;
  --teal-dark: #1F4F4D;
  --teal-glow: rgba(46,110,107,0.15);
  --text: #1A1D1C;
  --muted: #6E7573;
  --border: #E6E2DB;
  --clay: #BE7B4E;
  --clay-light: #FAF0E7;
  --danger: #C0563E;
  --danger-light: #FBEEEA;
  --shadow-sm: 0 2px 12px rgba(26,29,28,0.05);
  --shadow: 0 8px 32px rgba(26,29,28,0.09);
  --radius: 18px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Manrope', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }
svg { display: block; }

.lang-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: rgba(250,248,244,0.9);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.brand-mark { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: var(--teal-dark); letter-spacing: -0.01em; }
.lang-switch { display: flex; gap: 4px; background: var(--white); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
.lang-btn { background: none; border: none; border-radius: 7px; padding: 5px 13px; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); transition: all 0.2s; }
.lang-btn.active { background: var(--teal); color: #fff; }

.hero-wrap { max-width: 1080px; margin: 0 auto; padding: 56px 24px 72px; display: grid; grid-template-columns: 1fr 360px; gap: 56px; align-items: center; flex: 1; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; background: var(--teal-light); color: var(--teal-dark); border-radius: 30px; padding: 7px 16px; font-size: 13px; font-weight: 700; margin-bottom: 26px; letter-spacing: 0.01em; }
.eyebrow svg { width: 15px; height: 15px; }
.hero-title { font-family: 'Playfair Display', serif; font-size: clamp(32px, 4.2vw, 50px); font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 22px; }
.hero-title em { font-style: italic; color: var(--teal); }
.hero-sub { font-size: 17px; color: var(--muted); margin-bottom: 32px; max-width: 520px; line-height: 1.65; }
.value-promise { display: flex; flex-direction: column; gap: 12px; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 32px; max-width: 520px; box-shadow: var(--shadow-sm); }
.value-promise-head { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--teal); margin-bottom: 2px; }
.value-item { display: flex; align-items: flex-start; gap: 12px; }
.value-item svg { width: 20px; height: 20px; color: var(--teal); flex-shrink: 0; margin-top: 2px; }
.value-item span { font-size: 14.5px; color: var(--text); font-weight: 500; }
.value-item b { font-weight: 700; }
.btn-primary { display: inline-flex; align-items: center; gap: 10px; background: var(--teal); color: #fff; border: none; border-radius: 14px; padding: 18px 34px; font-family: 'Manrope', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.22s; margin-bottom: 42px; }
.btn-primary:hover { background: var(--teal-dark); transform: translateY(-2px); box-shadow: 0 10px 28px var(--teal-glow); }
.btn-primary svg { width: 18px; height: 18px; }
.facts { display: flex; gap: 36px; flex-wrap: wrap; }
.fact-num { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 600; color: var(--teal); line-height: 1; margin-bottom: 6px; }
.fact-label { font-size: 13px; color: var(--muted); max-width: 130px; }
.photo-card { background: var(--white); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
.photo-ph { width: 100%; aspect-ratio: 4/5; background: linear-gradient(160deg, #E9F2F1 0%, #D3E7E5 100%); display: block; overflow: hidden; }
.photo-ph img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
.photo-foot { padding: 20px 22px; border-top: 1px solid var(--border); }
.photo-foot strong { display: block; font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.photo-foot span { font-size: 13px; color: var(--muted); line-height: 1.4; }

.quiz-wrap { max-width: 660px; margin: 0 auto; padding: 36px 24px 64px; flex: 1; width: 100%; }
.quiz-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.quiz-step-label { font-size: 13px; color: var(--muted); font-weight: 700; }
.quiz-mini-map-hint { font-size: 12px; color: var(--teal); font-weight: 600; display: flex; align-items: center; gap: 5px; }
.quiz-mini-map-hint svg { width: 13px; height: 13px; }
.progress-bar { height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.progress-fill { height: 100%; background: var(--teal); border-radius: 10px; transition: width 0.45s cubic-bezier(0.4,0,0.2,1); }
.quiz-gift-bar { display: flex; align-items: center; gap: 10px; background: var(--clay-light); border: 1px solid #EAD3BC; border-radius: 11px; padding: 11px 16px; margin-bottom: 30px; font-size: 13px; color: #9A6236; font-weight: 600; }
.quiz-gift-bar svg { width: 17px; height: 17px; color: var(--clay); flex-shrink: 0; }
.q-title { font-family: 'Playfair Display', serif; font-size: clamp(22px, 3.2vw, 29px); font-weight: 600; margin-bottom: 26px; line-height: 1.3; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.option-card { background: var(--white); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px 16px; cursor: pointer; transition: all 0.18s; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.option-card:hover { border-color: var(--teal); background: var(--teal-light); transform: translateY(-1px); }
.option-card.selected { border-color: var(--teal); background: var(--teal-light); box-shadow: 0 0 0 1px var(--teal); }
.opt-icon { width: 26px; height: 26px; color: var(--teal); }
.opt-icon svg { width: 26px; height: 26px; }
.opt-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
.opt-sub { font-size: 12px; color: var(--muted); line-height: 1.4; }
.quiz-nav { display: flex; gap: 12px; }
.btn-back { background: none; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 22px; font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.2s; }
.btn-back:hover { border-color: var(--teal); color: var(--teal); }
.btn-next { flex: 1; background: var(--teal); border: none; border-radius: 12px; padding: 16px; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; transition: all 0.2s; }
.btn-next:hover { background: var(--teal-dark); }
.btn-next:disabled { opacity: 0.35; cursor: not-allowed; }

.result-wrap { max-width: 760px; margin: 0 auto; padding: 40px 24px 72px; flex: 1; width: 100%; }
.result-head { text-align: center; margin-bottom: 28px; }
.result-icon-state { width: 56px; height: 56px; margin: 0 auto 18px; background: var(--teal-light); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--teal); }
.result-icon-state svg { width: 30px; height: 30px; }
.result-title { font-family: 'Playfair Display', serif; font-size: clamp(24px, 3.5vw, 34px); font-weight: 600; line-height: 1.25; }
.map-frame { background: var(--white); border: 1px solid var(--border); border-radius: 22px; padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
.map-svg-wrap { width: 100%; position: relative; }
#mapSvg { width: 100%; height: auto; }
.map-cta-hint { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--teal); color: #fff; border: none; width: 100%; border-radius: 12px; padding: 15px; margin-top: 18px; font-family: 'Manrope', sans-serif; font-size: 14.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; animation: pulse 1.8s infinite; }
.map-cta-hint svg { width: 18px; height: 18px; }
.map-cta-hint:hover { background: var(--teal-dark); animation: none; }
.map-cta-hint.hidden { display: none; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--teal-glow); } 50% { box-shadow: 0 0 0 10px rgba(46,110,107,0); } }
.insight-blocks { display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }
.insight-block { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 24px 26px; opacity: 0; transform: translateY(16px); transition: opacity 0.5s, transform 0.5s; }
.insight-block.show { opacity: 1; transform: translateY(0); }
.insight-block-label { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--teal); margin-bottom: 12px; }
.insight-block-label svg { width: 15px; height: 15px; }
.insight-block p { font-size: 15px; line-height: 1.65; color: var(--text); margin-bottom: 10px; }
.insight-block p:last-child { margin-bottom: 0; }
.insight-accent { margin-top: 14px; padding: 12px 16px; background: var(--teal-light); border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--teal-dark); }

.form-outer, .thanks-outer { max-width: 660px; width: 100%; margin: 0 auto; padding: 48px 24px 72px; flex: 1; display: flex; align-items: flex-start; justify-content: center; }
.form-card, .thanks-card { width: 100%; background: var(--white); border: 1px solid var(--border); border-radius: 22px; padding: 40px; box-shadow: var(--shadow); }
.form-eyebrow { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--teal); margin-bottom: 12px; }
.form-title { font-family: 'Playfair Display', serif; font-size: clamp(25px, 4vw, 34px); font-weight: 600; line-height: 1.25; margin-bottom: 18px; }
.form-gift, .deficit-bar { display: flex; align-items: center; gap: 10px; border-radius: 11px; padding: 12px 15px; font-size: 13px; font-weight: 600; margin-bottom: 12px; }
.form-gift { background: var(--clay-light); border: 1px solid #EAD3BC; color: #9A6236; }
.deficit-bar { background: var(--danger-light); border: 1px solid #EBC8BE; color: var(--danger); }
.form-gift svg, .deficit-bar svg { width: 17px; height: 17px; flex-shrink: 0; }
.form-field { margin-top: 18px; }
.form-label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
.form-input { width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 15px; font-family: 'Manrope', sans-serif; font-size: 15px; outline: none; background: var(--cream); transition: border-color .2s, box-shadow .2s; }
.form-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-glow); }
.form-input.error { border-color: var(--danger); }
.btn-submit { width: 100%; margin-top: 24px; border: none; border-radius: 12px; padding: 16px; background: var(--teal); color: #fff; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; }
.btn-submit:disabled { opacity: .6; cursor: wait; }
.form-privacy { margin-top: 14px; text-align: center; color: var(--muted); font-size: 12px; }
.thanks-icon { width: 58px; height: 58px; border-radius: 50%; background: var(--teal-light); display: flex; align-items: center; justify-content: center; margin: 0 auto 26px; color: var(--teal); }
.thanks-icon svg { width: 36px; height: 36px; }
.thanks-title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; margin-bottom: 12px; }
.thanks-sub { font-size: 16px; color: var(--muted); margin-bottom: 34px; line-height: 1.6; }
.steps-list { text-align: left; display: flex; flex-direction: column; gap: 18px; }
.step-item { display: flex; align-items: flex-start; gap: 14px; }
.step-num { width: 34px; height: 34px; background: var(--teal); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.step-text strong { display: block; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.step-text span { font-size: 13.5px; color: var(--muted); }

@media (max-width: 1100px) {
  .hero-wrap { grid-template-columns: minmax(0, 1fr) minmax(300px, 360px); gap: 32px; padding-left: 20px; padding-right: 20px; }
  .hero-title { font-size: clamp(30px, 5vw, 44px); }
  .hero-sub { font-size: 16px; }
}

@media (max-width: 820px) {
  .lang-bar { position: relative; padding: 12px 16px; }
  .hero-wrap { grid-template-columns: 1fr; gap: 28px; padding: 32px 16px 48px; width: 100%; }
  .hero-wrap > * { min-width: 0; }
  .hero-title { font-size: clamp(30px, 8vw, 40px); }
  .hero-sub { font-size: 16px; }
  .value-promise { max-width: none; padding: 18px; }
  .btn-primary { width: 100%; justify-content: center; margin-bottom: 28px; }
  .facts { gap: 20px; }
  .photo-card { width: min(100%, 380px); max-width: 380px; margin: 0 auto; }
  .options-grid { grid-template-columns: 1fr; }
  .quiz-wrap, .result-wrap { padding-left: 16px; padding-right: 16px; }
  .form-card, .thanks-card { padding: 28px 20px; }
  .map-frame { padding: 12px; border-radius: 16px; }
  .map-svg-wrap { overflow: hidden; }
  #mapSvg { max-width: 100%; height: auto; }
}

@media (max-width: 480px) {
  .brand-mark { font-size: 14px; }
  .lang-btn { padding: 5px 10px; }
  .quiz-top { gap: 10px; }
  .quiz-mini-map-hint { display: none; }
  .q-title { font-size: 23px; }
  .btn-back { padding: 13px 16px; }
  .btn-next { padding: 15px 12px; }
}
</style>
</head>
<body>

<!-- ===== HERO ===== -->
<div id="screen-hero" class="screen active">
  <div class="lang-bar">
    <div class="brand-mark">Антон Ряхін</div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="uk" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
    </div>
  </div>
  <div class="hero-wrap">
    <div>
      <div class="eyebrow"><span data-t="eyebrow"></span></div>
      <h1 class="hero-title" data-t="heroTitle"></h1>
      <p class="hero-sub" data-t="heroSub"></p>
      <div class="value-promise">
        <div class="value-promise-head" data-t="valueHead"></div>
        <div class="value-item"><span data-t="value1"></span></div>
        <div class="value-item"><span data-t="value2"></span></div>
        <div class="value-item"><span data-t="value3"></span></div>
      </div>
      <button class="btn-primary" onclick="startQuiz()"><span data-t="startBtn"></span><span>→</span></button>
      <div class="facts">
        <div><div class="fact-num">30</div><div class="fact-label" data-t="fact1"></div></div>
        <div><div class="fact-num">5</div><div class="fact-label" data-t="fact2"></div></div>
        <div><div class="fact-num">7</div><div class="fact-label" data-t="fact3"></div></div>
      </div>
    </div>
    <div class="photo-card">
      <div class="photo-ph"><img src="map-hero.png" alt="Карта виходу" loading="eager"></div>
      <div class="photo-foot"><strong data-t="photoTitle"></strong><span data-t="photoSub"></span></div>
    </div>
  </div>
</div>

<!-- ===== QUIZ ===== -->
<div id="screen-quiz" class="screen">
  <div class="lang-bar">
    <div class="brand-mark">Антон Ряхін</div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="uk" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
    </div>
  </div>
  <div class="quiz-wrap">
    <div class="quiz-top"><span class="quiz-step-label" id="quizStep"></span><span class="quiz-mini-map-hint" data-t="quizHint"></span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="quiz-gift-bar"><span data-t="quizGiftBar"></span></div>
    <h2 class="q-title" id="qTitle"></h2>
    <div class="options-grid" id="optionsGrid"></div>
    <div class="quiz-nav"><button class="btn-back" id="btnBack" onclick="prevQuestion()" data-t="btnBack"></button><button class="btn-next" id="btnNext" onclick="nextQuestion()" disabled data-t="btnNext"></button></div>
  </div>
</div>

<!-- ===== RESULT ===== -->
<div id="screen-result" class="screen">
  <div class="lang-bar">
    <div class="brand-mark">Антон Ряхін</div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="uk" onclick="setLang('uk')">UA</button>
      <button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button>
    </div>
  </div>
  <div class="result-wrap">
    <div class="result-head"><div class="result-icon-state" id="resultIcon"></div><h2 class="result-title" data-t="resultTitle"></h2></div>
    <div class="map-frame"><div class="map-svg-wrap" id="mapSvgWrap"></div><button class="map-cta-hint" id="mapCtaHint" onclick="revealWall()"><span data-t="mapCtaHint"></span> →</button></div>
    <div class="insight-blocks">
      <div class="insight-block" id="ib1"><div class="insight-block-label" data-t="ib1label"></div><p data-t="ib1p1"></p><p data-t="ib1p2"></p></div>
      <div class="insight-block" id="ib2"><div class="insight-block-label" data-t="ib2label"></div><p data-t="ib2p1"></p><p data-t="ib2p2"></p></div>
      <div class="insight-block" id="ib3"><div class="insight-block-label" data-t="ib3label"></div><p data-t="ib3p1"></p><p data-t="ib3p2"></p><div class="insight-accent" data-t="ib3accent"></div></div>
    </div>
    <button class="btn-primary" id="resultFormTrigger" onclick="goTo('form')"><span data-t="toFormBtn"></span> →</button>
  </div>
</div>

<!-- ===== FORM ===== -->
<div id="screen-form" class="screen">
  <div class="lang-bar">
    <div class="brand-mark">Антон Ряхін</div>
    <div class="lang-switch"><button class="lang-btn active" data-lang="uk" onclick="setLang('uk')">UA</button><button class="lang-btn" data-lang="ru" onclick="setLang('ru')">RU</button></div>
  </div>
  <div class="form-outer">
    <div class="form-card">
      <div class="form-eyebrow" data-t="formEyebrow"></div>
      <h2 class="form-title" data-t="formTitle"></h2>
      <div class="form-gift"><span data-t="formGift"></span></div>
      <div class="deficit-bar"><span data-t="deficit"></span></div>
      <div class="form-field"><label class="form-label" data-t="labelName"></label><input class="form-input" id="inputName" type="text" data-ph="phName"></div>
      <div class="form-field"><label class="form-label" data-t="labelContact"></label><input class="form-input" id="inputContact" type="tel" autocomplete="tel" data-ph="phContact" maxlength="21"></div>
      <button class="btn-submit" id="btnSubmit" onclick="submitForm()"><span data-t="btnSubmit"></span></button>
      <p class="form-privacy" data-t="privacy"></p>
    </div>
  </div>
</div>

<!-- ===== THANKS ===== -->
<div id="screen-thanks" class="screen">
  <div class="thanks-outer"><div class="thanks-card"><div class="thanks-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><h2 class="thanks-title" id="thanksTitle"></h2><p class="thanks-sub" data-t="thanksSub"></p><div class="steps-list"><div class="step-item"><div class="step-num">1</div><div class="step-text"><strong data-t="step1t"></strong><span data-t="step1s"></span></div></div><div class="step-item"><div class="step-num">2</div><div class="step-text"><strong data-t="step2t"></strong><span data-t="step2s"></span></div></div><div class="step-item"><div class="step-num">3</div><div class="step-text"><strong data-t="step3t"></strong><span data-t="step3s"></span></div></div></div></div></div>
</div>

<script>

const STATE_ICONS = ['flame','compass','zap','tornado'];
let lang='uk', currentQ=0, answers=[], answerIdx=[], selectedOpts=[], userName='', wallRevealed=false;

function setLang(l){ lang=l; document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===l)); document.documentElement.lang=l; renderTexts(); if(isActive('quiz'))renderQuestion(); if(isActive('result'))renderResultTexts(); }
function isActive(name){ return document.getElementById('screen-'+name).classList.contains('active'); }
function goTo(name){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById('screen-'+name).classList.add('active'); window.scrollTo(0,0); if(name==='quiz')renderQuestion(); if(name==='result')renderResultTexts(); }
function renderTexts(){ const t=T[lang]; document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;if(t[k]!==undefined)el.textContent=t[k];}); document.querySelectorAll('[data-ph]').forEach(el=>{const k=el.dataset.ph;if(t[k]!==undefined)el.placeholder=t[k];}); }
function startQuiz(){ currentQ=0; answers=[]; answerIdx=[]; selectedOpts=[]; wallRevealed=false; goTo('quiz'); }
function renderQuestion(){ const t=T[lang], q=t.questions[currentQ]; document.getElementById('quizStep').textContent=`${currentQ+1} / ${t.questions.length}`; document.getElementById('progressFill').style.width=`${((currentQ+1)/t.questions.length)*100}%`; document.getElementById('qTitle').textContent=q.q; const grid=document.getElementById('optionsGrid'); grid.innerHTML=''; const saved=answerIdx[currentQ]||[]; q.opts.forEach((o,i)=>{const card=document.createElement('button');card.type='button';card.className='option-card'+(saved.includes(i)?' selected':'');card.innerHTML=`<span class="opt-icon">${ICON[o.icon]||''}</span><span class="opt-title">${o.t}</span><span class="opt-sub">${o.s}</span>`;card.onclick=()=>selectOption(i);grid.appendChild(card);}); document.getElementById('btnBack').style.visibility=currentQ===0?'hidden':'visible'; const next=document.getElementById('btnNext'); next.disabled=saved.length===0; next.textContent=currentQ===t.questions.length-1?'Завершить →':t.btnNext; }
function selectOption(i){ const q=T[lang].questions[currentQ]; if(q.multi){ selectedOpts=answerIdx[currentQ] ? [...answerIdx[currentQ]]:[]; const p=selectedOpts.indexOf(i); if(p>=0)selectedOpts.splice(p,1); else selectedOpts.push(i); } else selectedOpts=[i]; answerIdx[currentQ]=[...selectedOpts]; answers[currentQ]=selectedOpts.map(idx=>q.opts[idx].t).join(', '); renderQuestion(); }
function nextQuestion(){ if(!(answerIdx[currentQ]||[]).length)return; if(currentQ<T[lang].questions.length-1){currentQ++;renderQuestion();}else{buildResult();goTo('result');} }
function prevQuestion(){ if(currentQ>0){currentQ--;renderQuestion();} }
function buildResult(){ const wrap=document.getElementById('mapSvgWrap'); wrap.innerHTML=`<svg id="mapSvg" viewBox="0 0 700 430" role="img" aria-label="Карта"><rect width="700" height="430" rx="18" fill="#F3EDE3"/><path id="oldRoad" d="M40 350 C180 320 220 300 330 240 S500 150 650 70" fill="none" stroke="#BE7B4E" stroke-width="18" stroke-linecap="round"/><path id="newRoadPath" d="M330 240 C360 180 430 220 500 170 S600 110 660 120" fill="none" stroke="#2E6E6B" stroke-width="12" stroke-linecap="round" stroke-dasharray="800" stroke-dashoffset="800" opacity="0"/><g id="wallGroup"><rect id="wallRect" x="305" y="185" width="50" height="110" rx="8" fill="#777" opacity="0.95"/></g><g id="habitMarker" opacity="0"><circle cx="330" cy="240" r="28" fill="#FAF0E7" stroke="#BE7B4E" stroke-width="3"/></g><g id="habitLabelBox" opacity="0"><rect x="370" y="215" width="220" height="52" rx="10" fill="#fff" stroke="#E6E2DB"/><text x="390" y="246" font-family="Manrope" font-size="16" fill="#1A1D1C">Старая привычка</text></g><g id="flagGroup" opacity="0"><path d="M625 110v55" stroke="#2E6E6B" stroke-width="4"/><path d="M627 112h45l-22 18 22 18h-45z" fill="#2E6E6B"/></g><g id="carGroup" opacity="0"><circle cx="0" cy="0" r="14" fill="#2E6E6B"/><circle cx="-5" cy="-3" r="3" fill="#fff"/><circle cx="5" cy="-3" r="3" fill="#fff"/></g></svg>`; animateRoad(); document.getElementById('mapCtaHint').classList.remove('hidden'); ['ib1','ib2','ib3'].forEach(id=>document.getElementById(id).classList.remove('show')); document.getElementById('resultFormTrigger').classList.remove('show'); }
function renderResultTexts(){renderTexts();}
function animateRoad(){const svg=document.getElementById('mapSvg'),road=svg.querySelector('#oldRoad'),car=svg.querySelector('#carGroup'); road.style.strokeDasharray=road.getTotalLength(); road.style.strokeDashoffset=road.getTotalLength(); requestAnimationFrame(()=>road.style.strokeDashoffset='0'); car.setAttribute('opacity','1'); const len=road.getTotalLength(),dur=1600;let start=null;function step(ts){if(!start)start=ts;const prog=Math.min((ts-start)/dur,1),pt=road.getPointAtLength(prog*len*.98);car.setAttribute('transform',`translate(${pt.x},${pt.y})`);if(prog<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function revealWall(){if(wallRevealed)return;wallRevealed=true;const svg=document.getElementById('mapSvg');document.getElementById('mapCtaHint').classList.add('hidden');svg.querySelector('#wallGroup').style.transition='opacity .5s';svg.querySelector('#wallGroup').setAttribute('opacity','.35');const habit=svg.querySelector('#habitMarker');habit.style.transition='opacity .5s';habit.setAttribute('opacity','1');setTimeout(()=>{svg.querySelector('#habitLabelBox').style.transition='opacity .5s';svg.querySelector('#habitLabelBox').setAttribute('opacity','1');},400);setTimeout(()=>{const newRoad=svg.querySelector('#newRoadPath');newRoad.setAttribute('opacity','1');newRoad.style.transition='stroke-dashoffset 1.3s ease';newRoad.style.strokeDashoffset='0';},700);setTimeout(()=>moveCarNewRoute(),1400);setTimeout(()=>{const flag=svg.querySelector('#flagGroup');flag.style.transition='opacity .5s';flag.setAttribute('opacity','1');},2600);setTimeout(()=>revealInsights(),1200);}
function moveCarNewRoute(){const svg=document.getElementById('mapSvg'),car=svg.querySelector('#carGroup'),path=svg.querySelector('#newRoadPath'),len=path.getTotalLength(),dur=1400;let start=null;function step(ts){if(!start)start=ts;const prog=Math.min((ts-start)/dur,1),pt=path.getPointAtLength(prog*len);car.setAttribute('transform',`translate(${pt.x},${pt.y})`);if(prog<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function revealInsights(){['ib1','ib2','ib3'].forEach((id,i)=>setTimeout(()=>document.getElementById(id).classList.add('show'),i*450));setTimeout(()=>document.getElementById('resultFormTrigger').classList.add('show'),1550);}
function validContact(v){v=v.trim();if(!v)return false;if(v.startsWith('@')&&v.length>2)return true;return v.replace(/\D/g,'').length>=7;}
async function submitForm(){const nameEl=document.getElementById('inputName'),contactEl=document.getElementById('inputContact'),name=nameEl.value.trim(),contact=contactEl.value.trim();let ok=true;if(!name){nameEl.classList.add('error');ok=false;}if(!validContact(contact)){contactEl.classList.add('error');ok=false;}if(!ok)return;userName=name;const btn=document.getElementById('btnSubmit');btn.disabled=true;const oldLabel=btn.querySelector('span').textContent;btn.querySelector('span').textContent='...';const qs=T[lang].questions;const answerTexts=answers.slice();const questions=qs.map(q=>q.q);try{const response=await fetch('/api/send-lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,contact,lang,answerTexts,questions})});if(!response.ok)throw new Error('Lead endpoint returned '+response.status);try{gtag('event','generate_lead')}catch(e){}try{if(typeof fbq==='function')fbq('track','Lead')}catch(e){}showThanks();}catch(e){console.error('Lead submission error:',e);btn.disabled=false;btn.querySelector('span').textContent=oldLabel;alert(lang==='uk'?'Не вдалося надіслати заявку. Спробуйте ще раз.':'Не удалось отправить заявку. Попробуйте ещё раз.');}}
function escapeHtml(s){return s.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
function showThanks(){const title=lang==='uk'?`Дякую, ${userName}!`:`Спасибо, ${userName}!`;document.getElementById('thanksTitle').textContent=title;renderTexts();goTo('thanks');}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.form-input').forEach(inp=>inp.addEventListener('input',()=>inp.classList.remove('error')));renderTexts();});
